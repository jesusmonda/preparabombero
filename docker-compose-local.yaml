services:
  stripe_local:
    image: stripe/stripe-cli:latest
    entrypoint: /bin/sh
    command: -c "stripe listen --api-key ${STRIPE_API_KEY} --forward-to app_local:3000/webhook/"
    env_file: .env
    depends_on:
      app_local:
        condition: service_started
  app_local:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file: .env
    command: >
      sh -c "
        npm run start:dev
      "
    volumes:
      - '.:/app'
      - /app/node_modules/
      - /app/dist/
